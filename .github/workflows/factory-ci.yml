name: Factory CI

# Konative factory verify gate (TOL-639).
# Lint (instruction files — no ESLint in web/) + typecheck + fail-closed smoke.
# GitHub-hosted runners only. M1 self-hosted is a later step (not this PR).
# Reusable so Cloud Run deploy cannot start without these gates.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: lint · typecheck · smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Lint (instruction files)
        run: node scripts/factory-smoke.mjs

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      # Production `next build` stays in deploy-cloud-run.yml (needs NEXT_PUBLIC_*).
      # That job `needs` this workflow — deploy cannot skip these gates.

      - name: Smoke (factory docs + deploy gate)
        run: node scripts/factory-smoke.mjs

      - name: Smoke (unit)
        working-directory: web
        run: npm test -- src/lib/__tests__/feasibility-score.test.ts src/lib/__tests__/adminAccess.test.ts src/lib/__tests__/canadaDataset.test.ts src/lib/__tests__/newsPageQuery.test.ts

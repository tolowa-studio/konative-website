name: Factory CI

# Konative factory first slice (TOL-639 steps 3–5).
# Lint + typecheck + fail-closed smoke on every push/PR.
# GitHub-hosted runners only — M1 self-hosted is a later step.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: lint · typecheck · smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Lint (instruction files)
        run: node scripts/factory-smoke.mjs

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Smoke (factory docs)
        run: node scripts/factory-smoke.mjs

      - name: Smoke (unit)
        working-directory: web
        run: npm test -- src/lib/__tests__/feasibility-score.test.ts

name: One-time — verify Resend DNS records on konative.com

# Manual, one-shot utility. Uses the existing CLOUDFLARE_API_TOKEN repo secret
# (already used by the Worker deploy) to check its scope and, if it has Zone
# DNS edit rights on konative.com, add the 3 records Resend needs to verify
# konative.com as a sending domain (TOL-323 follow-up). Delete after running.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Verify token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "=== Token verify ==="
          curl -sS "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CF_TOKEN" | python3 -m json.tool

      - name: Find konative.com zone
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "=== Zone lookup ==="
          curl -sS "https://api.cloudflare.com/client/v4/zones?name=konative.com" \
            -H "Authorization: Bearer $CF_TOKEN" | tee /tmp/zone.json | python3 -m json.tool
          ZONE_ID=$(python3 -c "import json;print(json.load(open('/tmp/zone.json'))['result'][0]['id'])" 2>/dev/null || echo "")
          echo "ZONE_ID=${ZONE_ID}" >> "$GITHUB_ENV"

      - name: Add Resend DKIM TXT record
        if: env.ZONE_ID != ''
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            --data '{
              "type": "TXT",
              "name": "resend._domainkey.konative.com",
              "content": "p=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQCa/7h9OdVoIjzWYRBL2NaaqcY7Gg/Fux7uaBwL+CIJfxKItUzdTyV84+EB4KiGSi4C2Ke+LxRLr7dJHugoPingGP3ZSAut+3y02lL77fYFPnRz61OCjJWQxpNrDHfaNapQwrM/A8JiBesuYWOWBppq1FPVWv/B7Ox+Msm16JpGtQIDAQAB",
              "ttl": 3600
            }' | python3 -m json.tool

      - name: Add Resend SPF MX record
        if: env.ZONE_ID != ''
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            --data '{
              "type": "MX",
              "name": "send.konative.com",
              "content": "feedback-smtp.us-east-1.amazonses.com",
              "priority": 10,
              "ttl": 3600
            }' | python3 -m json.tool

      - name: Add Resend SPF TXT record
        if: env.ZONE_ID != ''
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
            -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
            --data '{
              "type": "TXT",
              "name": "send.konative.com",
              "content": "v=spf1 include:amazonses.com ~all",
              "ttl": 3600
            }' | python3 -m json.tool

      - name: No zone access
        if: env.ZONE_ID == ''
        run: echo "Token cannot see the konative.com zone — no DNS edit scope. See the token-verify step above for what it CAN do."

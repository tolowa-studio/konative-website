name: Provision Cloud SQL (staging)

# One-time / on-demand: creates konative-intel Cloud SQL + DATABASE_URI secret (TOL-314).
# After success, re-run "Deploy to Cloud Run (staging)" or push to main.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT: tolowa-studio
  GCP_REGION: us-west1

jobs:
  provision:
    runs-on: ubuntu-latest
    if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != ''

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Grant deployer Cloud SQL admin (idempotent)
        run: |
          DEPLOYER_SA="${{ vars.GCP_SERVICE_ACCOUNT }}"
          gcloud projects add-iam-policy-binding "${{ env.GCP_PROJECT }}" \
            --member="serviceAccount:${DEPLOYER_SA}" \
            --role="roles/cloudsql.admin" \
            --condition=None >/dev/null 2>&1 \
            || true

      - name: Provision Cloud SQL + DATABASE_URI secret
        run: bash scripts/gcp-provision-cloud-sql.sh

      - name: Redeploy Cloud Run with Cloud SQL socket
        env:
          CONNECTION_NAME: ${{ env.GCP_PROJECT }}:${{ env.GCP_REGION }}:konative-intel
        run: |
          gcloud run services update konative-website-staging \
            --project "${{ env.GCP_PROJECT }}" \
            --region "${{ env.GCP_REGION }}" \
            --add-cloudsql-instances="${CONNECTION_NAME}"

      - name: Smoke /api/v1/health
        run: |
          URL=$(gcloud run services describe konative-website-staging \
            --project "${{ env.GCP_PROJECT }}" \
            --region "${{ env.GCP_REGION }}" \
            --format='value(status.url)')
          echo "Cloud Run URL: ${URL}"
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "${URL}/api/v1/health")
          echo "Health status: ${code}"
          cat /tmp/health.json
          test "${code}" = "200"

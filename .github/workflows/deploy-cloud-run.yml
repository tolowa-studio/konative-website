name: Deploy to Cloud Run (staging)

# Parallel to the Cloudflare Worker deploy — does NOT cut over DNS.
# Requires GCP landing zone: scripts/gcp-provision-konative.sh

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/gcp-provision-cloud-sql.sh'
      - '.github/workflows/deploy-cloud-run.yml'
      - '.dockerignore'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT: tolowa-studio
  GCP_REGION: us-west1
  AR_REPO: konative-website
  IMAGE_NAME: konative
  SERVICE_NAME: konative-website-staging
  CLOUDSQL_INSTANCE: tolowa-studio:us-west1:konative-intel

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skip until WIF vars are configured (see scripts/gcp-provision-konative.sh).
    if: vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != ''

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Provision Cloud SQL when missing (TOL-314)
        continue-on-error: true
        run: |
          if gcloud sql instances describe konative-intel \
            --project "${{ env.GCP_PROJECT }}" >/dev/null 2>&1; then
            echo "Cloud SQL instance already exists — skipping provision"
            exit 0
          fi
          echo "Cloud SQL instance missing — provisioning..."
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
          bash scripts/gcp-provision-cloud-sql.sh

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_GHOST_URL: ${{ secrets.NEXT_PUBLIC_GHOST_URL }}
          NEXT_PUBLIC_GHOST_CONTENT_API_KEY: ${{ secrets.NEXT_PUBLIC_GHOST_CONTENT_API_KEY }}
          NEXT_PUBLIC_GTM_ID: ${{ secrets.NEXT_PUBLIC_GTM_ID }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
        run: |
          IMAGE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"
          docker build \
            -f web/Dockerfile \
            --build-arg NEXT_PUBLIC_SITE_URL="${NEXT_PUBLIC_SITE_URL}" \
            --build-arg NEXT_PUBLIC_SANITY_PROJECT_ID="${NEXT_PUBLIC_SANITY_PROJECT_ID}" \
            --build-arg NEXT_PUBLIC_SANITY_DATASET="${NEXT_PUBLIC_SANITY_DATASET}" \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${NEXT_PUBLIC_SUPABASE_URL}" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
            --build-arg NEXT_PUBLIC_GHOST_URL="${NEXT_PUBLIC_GHOST_URL}" \
            --build-arg NEXT_PUBLIC_GHOST_CONTENT_API_KEY="${NEXT_PUBLIC_GHOST_CONTENT_API_KEY}" \
            --build-arg NEXT_PUBLIC_GTM_ID="${NEXT_PUBLIC_GTM_ID}" \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="${NEXT_PUBLIC_SENTRY_DSN}" \
            -t "${IMAGE}" \
            .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          CLOUDSQL_FLAG=()
          if gcloud sql instances describe konative-intel \
            --project "${{ env.GCP_PROJECT }}" >/dev/null 2>&1; then
            CLOUDSQL_FLAG=(--add-cloudsql-instances "${{ env.CLOUDSQL_INSTANCE }}")
            echo "Cloud SQL instance found — attaching socket"
          else
            echo "Cloud SQL instance not found — deploy without socket (run provision-cloud-sql.yml)"
          fi
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --project "${{ env.GCP_PROJECT }}" \
            --image "${IMAGE}" \
            --region "${{ env.GCP_REGION }}" \
            --platform managed \
            --service-account konative-runtime@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com \
            "${CLOUDSQL_FLAG[@]}" \
            --port 8080 \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 3 \
            --memory 1Gi \
            --cpu 1 \
            --set-secrets="\
          SANITY_API_TOKEN=konative-SANITY_API_TOKEN:latest,\
          SUPABASE_SERVICE_ROLE_KEY=konative-SUPABASE_SERVICE_ROLE_KEY:latest,\
          ANTHROPIC_API_KEY=konative-ANTHROPIC_API_KEY:latest,\
          CRON_SECRET=konative-CRON_SECRET:latest,\
          NEWS_INGEST_TOKEN=konative-NEWS_INGEST_TOKEN:latest,\
          TWENTY_INTAKE_WEBHOOK_URL=konative-TWENTY_INTAKE_WEBHOOK_URL:latest,\
          TWENTY_INTAKE_WEBHOOK_TOKEN=konative-TWENTY_INTAKE_WEBHOOK_TOKEN:latest,\
          GHOST_URL=konative-GHOST_URL:latest,\
          GHOST_ADMIN_API_KEY=konative-GHOST_ADMIN_API_KEY:latest,\
          GHOST_CONTENT_API_KEY=konative-GHOST_CONTENT_API_KEY:latest,\
          RESEND_API_KEY=konative-RESEND_API_KEY:latest,\
          RESEND_FROM=konative-RESEND_FROM:latest,\
          RESEND_TO=konative-RESEND_TO:latest,\
          DATABASE_URI=konative-DATABASE_URI:latest" \
            --update-env-vars="\
          NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }},\
          NEXT_PUBLIC_SANITY_PROJECT_ID=${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }},\
          NEXT_PUBLIC_SANITY_DATASET=${{ secrets.NEXT_PUBLIC_SANITY_DATASET }},\
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }},\
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }},\
          NEXT_PUBLIC_GHOST_URL=${{ secrets.NEXT_PUBLIC_GHOST_URL }},\
          NEXT_PUBLIC_GHOST_CONTENT_API_KEY=${{ secrets.NEXT_PUBLIC_GHOST_CONTENT_API_KEY }},\
          NEXT_PUBLIC_GTM_ID=${{ secrets.NEXT_PUBLIC_GTM_ID }},\
          NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}"

      - name: Smoke /api/v1/health
        run: |
          URL=$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --project "${{ env.GCP_PROJECT }}" \
            --region "${{ env.GCP_REGION }}" \
            --format='value(status.url)')
          echo "Cloud Run URL: ${URL}"
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "${URL}/api/v1/health")
          echo "Health status: ${code}"
          cat /tmp/health.json
          homepage=$(curl -sf -o /dev/null -w "%{http_code}" "${URL}/" || echo "000")
          echo "Homepage status: ${homepage}"
          test "${homepage}" = "200"
          # Fail closed when DATABASE_URI is configured but health is not 200.
          if gcloud secrets versions access latest --secret=konative-DATABASE_URI --project="${{ env.GCP_PROJECT }}" >/dev/null 2>&1; then
            test "${code}" = "200"
          else
            echo "DATABASE_URI secret not set — health 503 acceptable until provision-cloud-sql.yml runs"
          fi
